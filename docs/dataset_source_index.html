<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UnlearnKT Dataset Statistics</title>
    <link rel="stylesheet" href="dataset_source_index.css?v=20260804b" />
  </head>
  <body>
    <div class="container">
      <div class="top">
        <h1>Educational Dataset Statistics (UnlearnKT)</h1>
      </div>

      <div class="toolbar">
        <label class="toggle">
          <input id="paper-only-toggle" type="checkbox" />
          <span>Show only datasets used in the paper</span>
        </label>
        <div id="dataset-count" class="dataset-count"></div>
      </div>

      <table>
        <thead>
          <tr>
            <th><span class="info-dot" data-field="used_in_paper"></span>used in paper</th>
            <th><span class="info-dot" data-field="name"></span>name</th>
            <th><span class="info-dot" data-field="n_interaction"></span>n_interaction</th>
            <th><span class="info-dot" data-field="n_user"></span>n_user</th>
            <th><span class="info-dot" data-field="n_concept"></span>n_concept</th>
            <th><span class="info-dot" data-field="n_question"></span>n_question</th>
            <th><span class="info-dot" data-field="avg_seq_len"></span>ave. seq_len</th>
            <th><span class="info-dot" data-field="avg_answer_acc"></span>ave. answer_acc</th>
            <th><span class="info-dot" data-field="question_sparsity"></span>question_sparsity</th>
            <th><span class="info-dot" data-field="concept_sparsity"></span>concept_sparsity</th>
            <th><span class="info-dot" data-field="side_info"></span>side_info</th>
            <th><span class="info-dot" data-field="link"></span>link</th>
          </tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
    <div id="tooltip" class="tooltip"></div>
    <script src="dataset_source_index.js?v=20260804b"></script>
  </body>
</html>
